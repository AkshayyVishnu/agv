# D500 sensor model presets for turing_ml.d500. Every value is explained in docs/DECISIONS.md.
# Change values here, never in code; the gym harness and (later) the ROS relay read the same file.
# Units: seconds, metres, radians, degrees only where the key says _deg.
d500:
  presets:
    # Best current estimate of the real sensor on our track. The default for eval.py and data collection.
    nominal:
      rate_hz: 10.0
      rate_jitter: 0.01
      sample_rate_hz: 5000.0
      latency_s: 0.05
      latency_jitter_s: 0.01
      spin_direction: cw          # inferred from the driver, NOT measured yet (D-05)
      mount_yaw: 0.0
      angle_jitter: 0.0035
      flip: false
      range_min: 0.03
      range_max: 12.0
      noise_bands: [[0.5, 0.010], [2.0, 0.020], [.inf, 0.030]]
      noise_scale: 1.0
      range_bias: 0.0
      base_noise_std: 0.01        # f1tenth_gym main already adds this much
      wall_visible_range: 4.5
      overshoot_nan_prob: 0.5
      pitch_up_prob: 0.02
      pitch_up_visible_range: [2.0, 3.5]
      pitch_down_prob: 0.01
      pitch_down_floor_range: [2.0, 3.5]
      pitch_sector_deg: [30.0, 90.0]
      dropout_prob: 0.01
      burst_rate: 0.05
      burst_width_deg: [3.0, 15.0]
      mixed_pixel_prob: 0.1
      mixed_pixel_jump: 0.3
      self_hit_sectors: []        # fill after the on-car self-hit check (D-11)

    # Pessimistic but physically plausible. Every driver must still lap here before going on the car.
    harsh:
      rate_hz: 9.0
      rate_jitter: 0.05
      sample_rate_hz: 5000.0
      latency_s: 0.08
      latency_jitter_s: 0.02
      spin_direction: cw
      mount_yaw: 0.02             # ~1.1 deg mounting error
      angle_jitter: 0.0087        # ~0.5 deg
      flip: false
      range_min: 0.03
      range_max: 8.0              # spec range on 4 % reflective (dark) targets
      noise_bands: [[0.5, 0.010], [2.0, 0.020], [.inf, 0.030]]
      noise_scale: 2.0
      range_bias: 0.02
      base_noise_std: 0.01
      wall_visible_range: 3.5
      overshoot_nan_prob: 0.5
      pitch_up_prob: 0.10
      pitch_up_visible_range: [1.5, 3.0]
      pitch_down_prob: 0.05
      pitch_down_floor_range: [1.5, 3.0]
      pitch_sector_deg: [30.0, 120.0]
      dropout_prob: 0.05
      burst_rate: 0.5
      burst_width_deg: [5.0, 25.0]
      mixed_pixel_prob: 0.3
      mixed_pixel_jump: 0.3
      self_hit_sectors: []

    # Unit tests ONLY. Never use for eval, tuning or data: it is the "perfect sim" the team rule forbids.
    clean:
      rate_jitter: 0.0
      latency_s: 0.0
      latency_jitter_s: 0.0
      angle_jitter: 0.0
      noise_scale: 0.0
      base_noise_std: 0.0
      wall_visible_range: 1000.0
      range_max: 1000.0
      pitch_up_prob: 0.0
      pitch_down_prob: 0.0
      dropout_prob: 0.0
      burst_rate: 0.0
      mixed_pixel_prob: 0.0

  # Per-episode domain randomization for training (D-13): [lo, hi] uniform, {choice: [...]} pick one.
  # Applied on top of the nominal preset; anything not listed keeps its nominal value.
  randomization:
    rate_hz: [8.5, 11.0]
    rate_jitter: [0.0, 0.05]
    latency_s: [0.03, 0.10]
    spin_direction: {choice: [cw, ccw]}   # unknown until measured: train on both
    mount_yaw: [-0.03, 0.03]
    angle_jitter: [0.0, 0.0087]
    noise_scale: [0.8, 2.0]
    range_bias: [-0.02, 0.02]
    wall_visible_range: [3.5, 5.0]
    pitch_up_prob: [0.0, 0.10]
    pitch_down_prob: [0.0, 0.05]
    dropout_prob: [0.0, 0.05]
    burst_rate: [0.0, 0.5]
    mixed_pixel_prob: [0.0, 0.3]
